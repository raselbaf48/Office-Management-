<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Office Management Application</title>
    <meta name="description" content="Centralized Multi-Office Management Application for personnel duty register, parade state tracker, TDY register, and monthly roster management." />
    <meta property="og:title" content="Office Management Application" />
    <meta property="og:description" content="Centralized Multi-Office Management Application for personnel duty register, parade state tracker, TDY register, and monthly roster management." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600;700;800;900&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet" crossorigin="anonymous">
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-pc-192x192.png?v=17" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-pc-512x512.png?v=17" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-pc-192x192.png?v=17" />
    <link rel="manifest" href="/manifest.json?v=17" />
    <style>
      /* Hide scrollbars across all browsers, Android WebView, and APK */
      *, *::before, *::after, html, body, #root {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      ::-webkit-scrollbar,
      *::-webkit-scrollbar,
      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      #root::-webkit-scrollbar {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
        background: transparent !important;
        -webkit-appearance: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
      }
      ::-webkit-scrollbar-thumb,
      *::-webkit-scrollbar-thumb,
      html::-webkit-scrollbar-thumb,
      body::-webkit-scrollbar-thumb {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
        background: transparent !important;
      }
      ::-webkit-scrollbar-track,
      *::-webkit-scrollbar-track {
        display: none !important;
        background: transparent !important;
      }
      ::-webkit-scrollbar-corner,
      *::-webkit-scrollbar-corner {
        display: none !important;
        background: transparent !important;
      }
    </style>
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Office Mgmt" />
    <style>
      html, body {
        background-color: #020617 !important;
        color: #f8fafc !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      @keyframes baf_pulse_anim {
        0% { left: -50%; width: 50%; }
        50% { left: 25%; width: 60%; }
        100% { left: 100%; width: 50%; }
      }
    </style>
  </head>
  <body style="background-color: #020617; color: #f8fafc; margin: 0; min-height: 100vh;">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
